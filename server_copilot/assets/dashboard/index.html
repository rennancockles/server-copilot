<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Home Server</title>
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <div id="stage">
    <header>
      <div class="brand"><span id="dot" class="dot s-unavailable"></span><h1>Home Server</h1></div>
      <div id="overall" class="overall">A carregar…</div>
      <div class="clock"><div id="time">--:--</div><div id="updated" class="muted"></div></div>
    </header>
    <main>
      <section id="host" class="panel s-unavailable"><h2>Servidor</h2><div class="body"></div></section>
      <section id="containers" class="panel s-unavailable"><h2><a href="/containers">Containers</a></h2><div class="body"></div></section>
      <section id="backup" class="panel s-unavailable"><h2>Backup</h2><div class="body"></div></section>
      <section id="network" class="panel s-unavailable"><h2><a href="/network">Rede</a></h2><div class="body"></div></section>
    </main>
    <div id="banner" class="banner" hidden></div>
  </div>
  <script src="/app.js"></script>
</body>
</html>
