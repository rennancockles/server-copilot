services:
  server-copilot:
    image: ghcr.io/rennancockles/server-copilot:${SERVER_COPILOT_VERSION:-latest}
    container_name: server-copilot
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      SERVER_COPILOT_PORT: ${SERVER_COPILOT_PORT:-8000}
      SERVER_COPILOT_DOCKER_HOST: ${SERVER_COPILOT_DOCKER_HOST:-tcp://docker-socket-proxy:2375}
      SERVER_COPILOT_HOST_DISKS: ${SERVER_COPILOT_HOST_DISKS:-}
      SERVER_COPILOT_AUTH_TOKEN: ${SERVER_COPILOT_AUTH_TOKEN:?set SERVER_COPILOT_AUTH_TOKEN in .env (openssl rand -hex 32)}
    # Host disks: bind-mount each filesystem to monitor read-only and list it in
    # SERVER_COPILOT_HOST_DISKS (name=/container/path,...), e.g.:
    #   SERVER_COPILOT_HOST_DISKS=root=/host/root,data=/host/data
    # volumes:
    #   - /:/host/root:ro
    #   - /mnt/data:/host/data:ro
    networks:
      - docker-api
      - edge
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

networks:
  docker-api:
    external: true
  edge:
    external: true
